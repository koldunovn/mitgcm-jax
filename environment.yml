# The environment mitjax runs in (docs/ENV.md; docs plan 20261006 Task 5). Written by hand; every version equals
# constraints.txt (mitjax/tests/test_env_pins.py checks it). Linux x86_64 is the tested platform, macOS arm64 best
# effort (plan decision 10).
#
#     conda env create -f environment.yml          # or: mamba env create -f environment.yml
#     conda activate mitjax
#     pip install -e .                             # mitjax itself, editable, from this directory
#
# GPU (CUDA 12, as pip wheels): pip install "jax[cuda12]==0.10.1" in the same env.
# A C preprocessor is needed at run time (mitjax runs `cpp -traditional -P` on the experiment's options, as MITgcm's
# genmake2 does): GNU cpp on Linux, clang's cpp on macOS (Xcode command line tools); MJX_CPP names another one.
name: mitjax
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - jax==0.10.1
      - jaxlib==0.10.1
      - numpy==2.4.6
      - scipy==1.17.1
      - netCDF4==1.7.4
      - pytest==9.0.3
      # the notebooks (pyproject extra `notebooks`, docs/ENV.md)
      - matplotlib==3.10.9
      - nbclient==0.11.0
      - nbformat==5.10.4
      - ipykernel==7.3.0
